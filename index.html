<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina web: do zero à primeira interação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Meu blog tech</h1> <!--Tag para título-->
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p><!--parágrafo-->
    </header>
    <main>
        <img src="livro.jpg" alt="imagem de um livro">
        <div>
            <h2> Meu primeiro post </h2>
            <p class="artigo-autor">Por: Gilmar Horchulhak</p>
            <p>Boas-vindas ao meu blog!</p>

            <button>❤️<span>0</span></button>
            <button>❤️<span>0</span></button>
        </div>
    </main>
    <footer>Rodapé</footer>
</body>
<script>
    const botoes=document.querySelectorAll("button");//cria uma variável chamada botão selecionando a tag "button"
    botoes.forEach(function(botao){
    botao.addEventListener("click", botaoClicado);//verifica se o botão foi clicado
    function botaoClicado(){//cria uma função
        console.log("Fui clicado");//mostra se o botão foi clicado
        let texto=document.querySelector("span");//cria uma variavel chamada "texto" selecionando a tag span
        texto.textContent++; //muda o valor do texto adicionando de uma unidade
    }
    })
</script>
</html>
