<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina web: do zero à primeira interação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Meu blog tech</h1> <!--Tag para título-->
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p><!--parágrafo-->
    </header>
    <main>
        <img src="livro.jpg" alt="imagem de um livro">
        <div>
            <h2> Meu primeiro post </h2>
            <p class="artigo-autor">Por: Gilmar Horchulhak</p>
            <p>Boas-vindas ao meu blog!</p>

            <button>❤️<span>0</span></button>
            <button>👍<span>0</span></button>
        </div>
    </main>
    <footer>Rodapé</footer>
</body>
<script>
    const botoes = document.querySelectorAll("button");//cria uma variável chamada botão selecionando a tag "button"
    let curtiu = botoes[0]
    let naocurtiu = botoes[1]

    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);//verifica se o botão foi clicado

        function botaoClicado() {

            let texto = botao.querySelector("span");
            if (curtiu === true) {
                texto.textContent++;
                console.log("curtiu");
                curtiu = false;
            } else if (naocurtiu === true) {
                texto.textContent++;
                console.log("naocurtiu");
                naocurtiu = false;
            }
        }
    })
    
</script>

</html>
